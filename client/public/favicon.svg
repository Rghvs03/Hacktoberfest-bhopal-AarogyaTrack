<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Clinical Shadow -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#14B8A6" stroke-width="1.5" />

  <!-- Subtle Medical Cross Silhouette Background -->
  <path d="M28 14h8v36h-8zM14 28h36v8H14z" fill="#0D9488" opacity="0.4" rx="2" />

  <!-- Dynamic ECG Heartbeat / Vital Pulse Line -->
  <path d="M8 32h14l4-8 6 18 5-14 4 7 3-3h12" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Glowing Focal Point Indicator (Longitudinal Tracking Node) -->
  <circle cx="32" cy="42" r="3.5" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="1.5" />
</svg>
